info:
  name: Get Recovery Password Code
  type: http
  seq: 4

http:
  method: POST
  url: "{{apiUrl}}/authentication/password-recovery"
  headers:
    - name: accept
      value: "*/*"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "mateus@gmail.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
