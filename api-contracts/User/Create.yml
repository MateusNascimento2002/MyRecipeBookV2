info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiUrl}}/users"
  headers:
    - name: Accept-Language
      value: en
  body:
    type: json
    data: |-
      {
        "name": "Mateus Nascimento",
        "email": "mateus12345@gmail.com",
        "password": "123456781"
      }

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("accessToken", res.body.tokens.accessToken)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
