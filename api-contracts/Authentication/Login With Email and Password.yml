info:
  name: Login With Email and Password
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiUrl}}/authentication"
  body:
    type: json
    data: |-
      {
        "email": "mateus@gmail.com",
        "password": "12345678"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("accessToken", res.body.tokens.accessToken)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
