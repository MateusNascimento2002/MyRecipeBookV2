info:
  name: Change Password With The Recovery Code
  type: http
  seq: 4

http:
  method: POST
  url: "{{apiUrl}}/authentication/password-recovery/reset"
  headers:
    - name: accept
      value: "*/*"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "mateus@gmail.com",
        "code": "545266",
        "newPassword": "1234567887"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("accessToken", "")

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
