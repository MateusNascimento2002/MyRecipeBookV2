version: "3.9"

services:
  postgres:
    image: postgres:18.4
    container_name: postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Password123@
      POSTGRES_DB: meulivrodereceitas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d meulivrodereceitas"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local