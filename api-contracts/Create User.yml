info:
  name: Create User
  type: http
  seq: 1

http:
  method: POST
  url: https://localhost:5000/users
  headers:
    - name: Accept-Language
      value: en
  body:
    type: json
    data: |-
      {
        "name": "Mateus Nascimento",
        "email": "mateus@gmail.com",
        "password": "12345678"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
